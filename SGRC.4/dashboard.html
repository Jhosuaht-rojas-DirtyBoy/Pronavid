<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pronavid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilosdash.css">
</head>

<body>

    <!-- HEADER -->
    <header class="barra-superior">
        <div class="logo-area">
            <img src="Logopronavid.png" class="logo" alt="Logo Pronavid">
        </div>

        <div class="usuario-contenedor">
            <span>Administrador</span>
            <a href="perfiladmin.html" class="icono-usuario">👤</a>
        </div>
    </header>

    <!-- TÍTULO -->
    <section class="titulo-panel">
        <h2>Panel Administrativo</h2>
        <p>Seleccione una opción para continuar</p>
    </section>

    <!-- PANEL PRINCIPAL -->
    <main class="dashboard-panel">

        <a href="registropedidos.html" class="tarjeta">
            <span class="icono">📦</span>
            <h3>Pedidos</h3>
            <p>Registrar nuevos pedidos</p>
        </a>

        <a href="historial.html" class="tarjeta">
            <span class="icono">👥</span>
            <h3>Clientes</h3>
            <p>Historial de registros</p>
        </a>

        <a href="reportebasico.html" class="tarjeta">
            <span class="icono">📊</span>
            <h3>Reportes</h3>
            <p>Resumen estadístico</p>
        </a>

        <a href="seguimientocliente.html" class="tarjeta">
            <span class="icono">📈</span>
            <h3>Seguimiento</h3>
            <p>Control y gestión</p>
        </a>

        <a href="catalogo.html" class="tarjeta">
            <span class="icono">🛒</span>
            <h3>Catálogo</h3>
            <p>Productos disponibles</p>
        </a>

    </main>

    <!-- FOOTER -->
    <footer class="barra-inferior">
        <a href="index.html" class="cerrar-sesion">Cerrar sesión</a>
    </footer>

</body>
</html>
