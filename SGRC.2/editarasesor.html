<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Pronavid</title>
  <link rel="stylesheet" href="editar.css">
</head>
<body>
  <header>
   <img src="https://pronavid.com.co/wp-content/uploads/2023/02/cropped-Mesa-de-trabajo-1-copia.png" alt="Logo Pronavid" class="logo">
  </header>

  <main class="contenedor">
    <a href="perfilasesor.html" class="back-arrow">⟵</a>
    <div class="perfil">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZA1tDcHTLzM4kr1a5uYu-WMYwpFrnFpKI5g&s" alt="Foto de perfil" class="foto-perfil">
      <form>
       <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="example@correo.com">

        <label for="contacto">Número de contacto</label>
        <input type="text" id="contacto" placeholder="+57 300 000 0000">

        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" placeholder="Ejemplo: Asesor">

        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo">
        <a href="exitoasesor.html" class="btn">Guardar datos</a>
      </form>
    </div>
  </main>
</body>
</html>
