<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Clientes - Página 2</title>
  <link rel="stylesheet" href="historial.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="encabezado">
    <img src="Logopronavid.png" alt="Logo Pronavid" class="logo">
  </header>

  <!-- Botón volver -->
  <a href="dashboard.html" class="btn-volver">⤺</a>

  <!-- Encabezados -->
  <section class="encabezado-tabla">
    <span>Producto</span>
    <span>Fecha</span>
    <span>Monto total</span>

  </section>

  <!-- Contenedor de pedidos -->
  <section class="contenedor-pedidos">

    <div class="pedido">
      <div class="columna producto">
        <div class="producto-item">
          <p>Granola superior</p>
          <img src="granola.png" alt="">
          <span>x3</span>
        </div>
      </div>
      <div class="columna fecha"><strong>02/07/2025</strong></div>
      <div class="columna monto"><strong>$42.000</strong></div>
      <div class="columna cliente">Tienda DomiPan</div>

    <!-- Pedido 5 -->
    <div class="pedido">
      <div class="columna producto">
        <div class="producto-item">
          <p>Choquy Arroz</p>
          <img src="choquy.jpeg" alt="">
          <span>x4</span>
        </div>
      </div>
      <div class="columna fecha"><strong>03/07/2025</strong></div>
      <div class="columna monto"><strong>$73.250</strong></div>
      <div class="columna cliente">MiniMarket El Sol</div>
    </div>

  </section>

  <!-- Paginación -->
  <div class="paginacion">
    <a href="historial.html" class="pagina-anterior">←</a>

  </div>
