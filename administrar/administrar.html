    <title>Control de Roles</title>
    <link rel="stylesheet" href="administrar.css">

<body>

<header>Control de Roles</header>

<div class="container">

            </thead>
            <tbody>

                    </td>
                </tr>

</div>

<script src="administrar.js"></script>
</body>
</html>
