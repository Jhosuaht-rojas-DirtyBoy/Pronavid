<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="estilosdash.css">
</head>
<body>

    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="logo-contenedor">
            <img src="imagenes/Logopronavid.png" alt="Logo Pronavid" class="logo">
        </div>
    <div class="usuario-contenedor">
    <span class="texto-admin">Administrador</span>
    <span class="icono-usuario">👤</span>
</div>
    </header>
    <div class="texto_inicio">
        <p class="instruccion">Haga click en lo que desee</p>
</div>
    <section class="opciones">
        <button class="btn-nav">◀</button>
        <button class="btn-opcion">Registro de pedido</button>
        <button class="btn-opcion activo">Historial de clientes</button>
        <button class="btn-opcion">Reportes básicos</button>
        <button class="btn-nav">▶</button>
    </section>
    <div class="barra_media">
    </div>

    <!-- Imagen decorativa -->
    <div class="contenedor-imagen">
        <img src="imagenes/Pronavid(Barras).webp" alt="Productos Pronavid" class="imagen-fondo">
    </div>

    <!-- Barra inferior -->
    <footer class="barra-inferior">
        <button class="cerrar-sesion">Cerrar sesión</button>
    </footer>

</body>
</html>
