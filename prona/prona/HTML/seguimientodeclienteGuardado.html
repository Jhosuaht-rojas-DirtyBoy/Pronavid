<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento - Guardado</title>

    <!-- Estilos principales -->
    <link rel="stylesheet" href="../CSS/estilos.css">

    <!-- Tipografía opcional si no está en estilos.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Fallback mínimo */
        body { font-family:'Montserrat',sans-serif; background:#f4f6f8; margin:0; }
        .btn-volver { text-decoration:none; font-size:24px; color:#b72025; }
        .campo label { font-weight:600; display:block; margin-bottom:4px; }
        .campo input { width:100%; padding:8px; }
        button { cursor:pointer; }
        .btn-buscar, .btn-detalle, .btn-actualizar {
            padding:8px 14px; border:none; border-radius:4px;
        }
        .btn-buscar { background:#b72025; color:#fff; }
        .btn-detalle { background:#0077cc; color:#fff; }
        .btn-actualizar { background:#28a745; color:#fff; }
    </style>
</head>

<body>

    <!-- Header universal -->
    <div data-include="/HTML/partials/header.html"></div>

    <main style="max-width:1000px;margin:20px auto; padding:10px;">

        <!-- Volver -->
        <a href="seguimientocliente.html" class="btn-volver" style="display:inline-block;margin-bottom:15px;">⤺ Volver</a>

        <!-- Formulario -->
        <section class="formulario" style="margin-bottom:25px;">
            <div class="fila" style="display:flex;gap:12px;flex-wrap:wrap;">

                <div class="campo">
                    <label for="idCliente">ID del cliente</label>
                    <input type="text" id="idCliente" placeholder="Ingrese ID">
                </div>

                <div class="campo">
                    <label for="clienteNombre">Cliente</label>
                    <input type="text" id="clienteNombre" placeholder="Nombre del cliente">
                </div>

                <div class="campo">
                    <label for="fechaRegistro">Fecha</label>
                    <input type="date" id="fechaRegistro">
                </div>
            </div>

            <div class="fila" style="margin-top:12px;display:flex;gap:12px;">
                <div class="campo" style="flex:1;">
                    <label for="nombreClienteBuscar">Nombre cliente</label>
                    <input type="text" id="nombreClienteBuscar" placeholder="Buscar cliente...">
                </div>

                <div style="align-self:flex-end;">
                    <button class="btn-buscar" type="button">BUSCAR</button>
                </div>
            </div>
        </section>

        <!-- Resultado Guardado -->
        <section class="seccion-inferior" style="margin-top:16px;">
            <div class="barra-inferior" style="padding:12px;background:#fff;border-radius:8px;">

                <!-- Encabezados -->
                <div class="encabezado-tabla" style="display:flex;gap:16px;font-weight:600;">
                    <span style="flex:1">ID</span>
                    <span style="flex:2">Cliente</span>
                    <span style="flex:1">Fecha</span>
                    <span style="flex:2">Nombre cliente</span>
                    <span style="flex:1">Estado actual</span>
                </div>

                <!-- Datos -->
                <div class="fila-datos" style="display:flex;gap:16px;padding:10px 0;border-top:1px solid #eee;">
                    <span style="flex:1">1</span>
                    <span style="flex:2">Distrifruver</span>
                    <span style="flex:1">03/02/25</span>
                    <span style="flex:2">Carlos Salamanca</span>
                    <span style="flex:1; color:#ff8c00;">En proceso</span>
                </div>

                <!-- Botones -->
                <div class="botones" style="margin-top:12px; display:flex; gap:10px;">
                    <a href="seguimientodeclientesdetalle.html">
                        <button class="btn-detalle" type="button">VER DETALLE</button>
                    </a>

                    <a href="seguimientodeclientesactualizar.html">
                        <button class="btn-actualizar" type="button">ACTUALIZAR ESTADO</button>
                    </a>
                </div>

            </div>
        </section>
    </main>

    <!-- Script para cargar header -->
    <script src="../JS/include-html.js"></script>

</body>
</html>
