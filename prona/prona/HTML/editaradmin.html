<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Administrador</title>
    <link rel="stylesheet" href="../CSS/editar.css">
</head>

<body>
    <div data-include="includes/header.html"></div>

    <main class="contenedor">

        <a href="perfiladmin.html" class="back-arrow">⟵</a>

        <div class="perfil">

            <img src="https://i.pinimg.com/236x/3e/54/5c/3e545c588cd12b61b5989ea4a24f4517.jpg" 
                 alt="Foto de perfil" 
                 class="foto-perfil">

            <!-- FORMULARIO FUNCIONAL -->
            <form id="formAdmin">

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required>

                <label for="contacto">Número de contacto</label>
                <input type="text" id="contacto" required>

                <label for="cargo">Cargo</label>
                <input type="text" id="cargo" required>

                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required>

                <button type="submit" class="btn">Guardar datos</button>

                <!-- Mensaje de éxito -->
                <p id="mensajeExito" style="display:none; color:green; margin-top:10px;">
                    ✔ Datos guardados correctamente
                </p>
            </form>
        </div>
    </main>

    <div data-include="includes/footer.html"></div>
    <script src="../JS/include-html.js"></script>

    <!-- SCRIPT para guardar datos Administración -->
    <script>
        const form = document.getElementById("formAdmin");
        const mensaje = document.getElementById("mensajeExito");

        // Cargar datos guardados
        window.onload = () => {
            document.getElementById("correo").value = localStorage.getItem("admin_correo") || "";
            document.getElementById("contacto").value = localStorage.getItem("admin_contacto") || "";
            document.getElementById("cargo").value = localStorage.getItem("admin_cargo") || "";
            document.getElementById("nombre").value = localStorage.getItem("admin_nombre") || "";
        };

        // Guardar datos
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            localStorage.setItem("admin_correo", document.getElementById("correo").value);
            localStorage.setItem("admin_contacto", document.getElementById("contacto").value);
            localStorage.setItem("admin_cargo", document.getElementById("cargo").value);
            localStorage.setItem("admin_nombre", document.getElementById("nombre").value);

            mensaje.style.display = "block";

            setTimeout(() => {
                mensaje.style.display = "none";
            }, 2000);
        });
    </script>

</body>
</html>
