<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronavid - Login / Registro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <!-- HEADER -->
    <div data-include="/HTML/partials/header.html"></div>

    <main class="contenedor contenedor-login">

        <!-- Encabezado -->
        <header class="encabezado-login">
            <img src="Logopronavid.png" alt="Logo Pronavid" class="logo-login">
            <h1 id="tituloRol">Iniciar Sesión</h1>
        </header>

        <!-- Selector de Rol -->
        <div class="selector-rol">
            <button id="rolAsesor" class="btn-rol">Asesor</button>
            <button id="rolAdmin" class="btn-rol">Administrador</button>
        </div>

        <!-- Formulario Login -->
        <form id="loginForm" class="formulario oculto">
            <label for="email">Correo:</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn-login">Iniciar Sesión</button>

            <a href="#" id="irRegistro" class="link-cambio">¿No tienes cuenta? Registrarse</a>

            <div id="mensaje" class="msg oculto"></div>

            <div class="actions-login">
                <button type="button" id="checkTokenBtn">Verificar Token</button>
                <button type="button" id="showTokenBtn">Ver Token</button>
                <button type="button" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </form>

        <!-- Formulario Registro -->
        <form id="registroForm" class="formulario oculto">

            <label for="regName">Nombre:</label>
            <input type="text" id="regName" required>

            <label for="regEmail">Correo:</label>
            <input type="email" id="regEmail" required>

            <label for="regPassword">Contraseña:</label>
            <input type="password" id="regPassword" required>

            <label for="regRol">Rol:</label>
            <select id="regRol">
                <option value="Asesor">Asesor</option>
                <option value="Administrador">Administrador</option>
            </select>

            <div id="codigoAdminDiv" class="campo-oculto oculto">
                <label for="regCodigoAdmin">Código Admin:</label>
                <input type="password" id="regCodigoAdmin" placeholder="Ingresa el código admin">
            </div>

            <button type="submit" class="btn-login">Registrar</button>

            <a href="#" id="irLogin" class="link-cambio">¿Ya tienes cuenta? Iniciar Sesión</a>

            <div id="mensajeReg" class="msg oculto"></div>
        </form>

    </main>

    <script src="../JS/app.js"></script>

</body>
</html>
