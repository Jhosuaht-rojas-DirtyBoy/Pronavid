<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Pronavid</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/recuperarcontra.css">
</head>

<body>

    <div class="container">

        <!-- Encabezado -->
        <header class="header">
            <img src="img/Logopronavid.png" alt="Logo Pronavid" class="logo">
        </header>

        <!-- PASO 1: INGRESAR CORREO -->
        <section class="content" id="paso1">
            <div class="loader"></div>

            <h2>Recuperar contraseña</h2>
            <p>Ingresa tu correo electrónico para recibir un enlace de recuperación.</p>

            <input type="email" id="correo" placeholder="Correo electrónico" required>

            <button id="btnCorreo">Enviar enlace de recuperación</button>

            <footer class="footer">
                <p>Recibirás un enlace en tu correo para restablecer tu contraseña.</p>
            </footer>
        </section>

        <!-- PASO 2: INGRESAR CÓDIGO -->
        <section class="content oculto" id="paso2">
            <div class="loader"></div>

            <h2>Recuperar contraseña</h2>
            <p>Ingresa el código enviado a tu correo.</p>

            <input type="text" id="codigo" placeholder="Código de verificación">

            <button id="btnCodigo">Verificar código</button>
        </section>

        <!-- PASO 3: NUEVA CONTRASEÑA -->
        <section class="content oculto" id="paso3">
            <div class="loader"></div>

            <h2>Crear nueva contraseña</h2>

            <input type="password" id="nueva" placeholder="Nueva contraseña" required>
            <input type="password" id="confirmar" placeholder="Confirmar contraseña" required>

            <button id="btnNueva">Guardar nueva contraseña</button>
        </section>

    </div>

    <!-- Script -->
    <script src="JS/recuperarcontra.js"></script>

</body>
</html>
