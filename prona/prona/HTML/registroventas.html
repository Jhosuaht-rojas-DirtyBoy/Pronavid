<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de Ventas</title>
<link rel="stylesheet" href="../CSS/ventas.css">
</head>
<body>
  <div data-include="../PHP/includes/header.php"></div>

  <header class="encabezado"><h1>REGISTRO DE VENTAS</h1></header>
  <section class="contenedor">
    <form id="ventaForm" class="tarjeta">
      <h2>Registrar Venta</h2>
      <label>Nombre del Asesor</label><input type="text" id="asesor" required>
      <label>Cliente</label><input type="text" id="cliente" required>
      <label>Producto Vendido</label><input type="text" id="producto" required>
      <label>Valor de Venta</label><input type="number" id="valor" required>
      <button type="submit" class="btn">Registrar</button>
    </form>

    <div class="tarjeta tabla">
      <h2>Ventas Registradas</h2>
      <table id="tablaVentas"><thead><tr><th>Asesor</th><th>Cliente</th><th>Producto</th><th>Valor</th><th>Fecha</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

  <script src="../JS/include-html.js"></script>
  <script>
    document.getElementById('ventaForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const usuario = JSON.parse(sessionStorage.getItem('user')||'null');
      if(!usuario) return alert('Inicia sesión para registrar ventas');
      const items = [{ id_producto: 0, cantidad:1, precio_unitario: Number(document.getElementById('valor').value) }];
      const payload = {
        id_usuario: usuario.id,
        subtotal: Number(document.getElementById('valor').value),
        items
      };
      const res = await fetch('/PHP/ventas/create.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const data = await res.json();
      if(!res.ok) return alert(data.error||'Error');
      alert('Venta registrada ID: '+data.id_venta);
      loadVentas();
    });

    async function loadVentas(){
      const res = await fetch('/PHP/ventas/list.php');
      const data = await res.json();
      const tbody = document.querySelector('#tablaVentas tbody');
      tbody.innerHTML = (data.data || []).map(v=>`<tr><td>${v.primer_nombre || ''}</td><td>-</td><td>-</td><td>${v.subtotal}</td><td>${v.fecha_venta}</td></tr>`).join('');
    }
    loadVentas();
  </script>
</body>
</html>
