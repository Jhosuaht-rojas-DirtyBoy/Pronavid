<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Cliente - Pronavid</title>

    <!-- Estilos principales -->
    <link rel="stylesheet" href="../CSS/estilos.css">

    <!-- Fuente (opcional si ya está incluída en estilos.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Fallback mínimo */
        body { font-family: 'Montserrat', sans-serif; background:#f4f6f8; margin:0; }
        .btn-volver { text-decoration:none; font-size:24px; color:#b72025; }
        .campo label { font-weight:600; display:block; margin-bottom:4px; }
        .campo input { width:100%; padding:8px; }
        button.btn-buscar { padding:8px 14px; background:#b72025; border:none; color:#fff; cursor:pointer; }
    </style>
</head>

<body>

    <!-- Header universal -->
    <div data-include="/HTML/partials/header.html"></div>

    <main style="max-width:1000px;margin:20px auto;padding:10px;">

        <!-- Botón volver -->
        <a href="dashboard.html" class="btn-volver" style="display:inline-block;margin-bottom:15px">⤺ Volver</a>

        <!-- Formulario de búsqueda -->
        <section class="formulario" style="margin-bottom:25px;">
            <div class="fila" style="display:flex;gap:12px;flex-wrap:wrap;">

                <div class="campo">
                    <label for="idCliente">ID del cliente</label>
                    <input type="text" id="idCliente" placeholder="Ingrese ID">
                </div>

                <div class="campo">
                    <label for="clienteNombreInput">Cliente</label>
                    <input type="text" id="clienteNombreInput" placeholder="Nombre del cliente">
                </div>

                <div class="campo">
                    <label for="fechaInput">Fecha</label>
                    <input type="date" id="fechaInput">
                </div>

            </div>

            <!-- Buscador -->
            <div class="fila" style="margin-top:12px;display:flex;gap:12px;">
                <div class="campo" style="flex:1;">
                    <label for="nombreClienteBuscar">Nombre cliente</label>
                    <input type="text" id="nombreClienteBuscar" placeholder="Buscar cliente...">
                </div>

                <div style="align-self:flex-end;">
                    <a href="seguimientodeclienteGuardado.html">
                        <button class="btn-buscar" type="button">BUSCAR</button>
                    </a>
                </div>
            </div>
        </section>

        <!-- Tabla (Estructura vacía para futura conexión a DB) -->
        <section class="seccion-inferior">
            <div class="barra-inferior" style="background:#fff;padding:12px;border-radius:8px;">

                <div class="encabezado-tabla" style="display:flex;gap:16px;font-weight:600;">
                    <span style="flex:1">ID</span>
                    <span style="flex:2">Cliente</span>
                    <span style="flex:1">Fecha</span>
                    <span style="flex:2">Nombre cliente</span>
                    <span style="flex:1">Estado actual</span>
                </div>

            </div>
        </section>
    </main>

    <!-- Script para cargar el header -->
    <script src="../JS/include-html.js"></script>

</body>
</html>
