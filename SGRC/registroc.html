<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Clientes - Pronavid</title>
  <link rel="stylesheet" href="registroc.css">
</head>
<body>

  <header class="encabezado">
    <img src="Logopronavid.png" alt="Logo Pronavid" class="logo">
  </header>

  <a href="historial.html" class="btn-volver">⤺</a>

  <div class="selector">
    <select onchange="location = this.value;">
        <option value="Seleccionar">Seleccionar</option>
      <option value="registro.html">Registro de clientes</option>
      <option value="frecuente.html">Cliente más frecuente</option>
      <option value="masvendido.html">Más comprado</option>
    </select>
  </div>
  <div class="dropdown-container right">
  <select class="custom-select month-select">
    <option selected disabled>Mes</option>
    <option>Enero</option>
    <option>Febrero</option>
    <option>Marzo</option>
    <option>Abril</option>
    <option>Mayo</option>
  </select>
</div>

  <section class="tabla-contenedor">
    <table>
      <tr>
        <th>Nombres de la empresa</th>
        <th>Granola superior</th>
        <th>Choquy Arroz</th>
        <th>Galleta 60g</th>
      </tr>
      <tr>
        <td>Distrifruver</td>
        <td>20</td>
        <td>15</td>
        <td>25</td>
      </tr>
      <tr>
        <td>Mercauno</td>
        <td>20</td>
        <td>20</td>
        <td>15</td>
      </tr>
      <tr>
        <td>Deuno</td>
        <td>30</td>
        <td>25</td>
        <td>20</td>
      </tr>
      <tr>
        <td>Granisero</td>
        <td>40</td>
        <td>30</td>
        <td>30</td>
      </tr>
      <tr>
        <td>Agromanisero</td>
        <td>35</td>
        <td>20</td>
        <td>30</td>
      </tr>
    </table>
  </section>

</body>
</html>
