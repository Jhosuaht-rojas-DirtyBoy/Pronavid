<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="recuperarcontra.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="Logopronavid.png" alt="Logo Pronavid">
        </div>

        <!-- Paso 1: Ingresar correo -->
        <div class="content" id="paso1">
            <div class="loader"></div>
            <h2>Recuperar contraseña</h2>
            <p>Ingresa tu correo electrónico para recibir un código para recuperar tu contraseña.</p>
            <input type="email" id="correo" placeholder="Correo electrónico">
            <button id="btnCorreo">Enviar enlace de recuperación</button>
            <div class="footer">
                <p>Recibirás un enlace en tu correo para restablecer contraseña.</p>
            </div>
        </div>

        <!-- Paso 2: Ingresar código -->
        <div class="content oculto" id="paso2">
            <div class="loader"></div>
            <h2>Recuperar contraseña</h2>
            <p>Ingresa el código para restablecer la contraseña.</p>
            <input type="text" id="codigo" placeholder="Código">
            <button id="btnCodigo">Ingresar código</button>
        </div>

        <!-- Paso 3: Nueva contraseña -->
        <div class="content oculto" id="paso3">
            <div class="loader"></div>
            <h2>Ingresar nueva contraseña</h2>
            <input type="password" id="nueva" placeholder="Ingresar contraseña nueva">
            <input type="password" id="confirmar" placeholder="Confirmar contraseña">
            <button id="btnNueva">Ingresar nueva contraseña</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
