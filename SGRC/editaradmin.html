<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Pronavid</title>
  <link rel="stylesheet" href="editar.css">
</head>
<body>
  <header>
   <img src="Logopronavid.png" alt="Logo Pronavid" class="logo">
  </header>

  <main class="contenedor">
    <a href="perfiladmin.html" class="back-arrow">⟵</a>
    <div class="perfil">
      <img src="https://i.pinimg.com/236x/3e/54/5c/3e545c588cd12b61b5989ea4a24f4517.jpg" alt="Foto de perfil" class="foto-perfil">
      <form>
       <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="example@correo.com">

        <label for="contacto">Número de contacto</label>
        <input type="text" id="contacto" placeholder="+57 300 000 0000">

        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" placeholder="Ejemplo: Administrador">

        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo">
        <a href="exitoadmin" class="btn">Guardar datos</a>
      </form>
    </div>
  </main>
</body>
</html>
