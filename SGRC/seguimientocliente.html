<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segumientocliente</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Encabezado rojo -->
    <header>
        <img src="Logopronavid.png" alt="Pronavid" class="logo">
    </header>

    <div class="volver">
        <span>&#x21A9;</span>
    </div>

    <!-- Formulario -->
    <section class="formulario">
        <div class="fila">
            <div class="campo">
                <label>ID del cliente</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Cliente</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Fecha</label>
                <input type="date">
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label>Nombre cliente</label>
                <input type="text">
            </div>
            <a href="seguimientodeclienteGuardado.html"><button class="btn-buscar">BUSCAR</button></a>
        </div>
    </section>

    <section class="seccion-inferior">
        <div class="fondo-difuminado"></div>
        <div class="barra-inferior">
            <div class="encabezado-tabla">
                <span>ID</span>
                <span>Cliente</span>
                <span>Fecha</span>
                <span>Nombre cliente</span>
                <span>Estado actual</span>
            </div>
        </div>
    </section>
</body>
</html>
